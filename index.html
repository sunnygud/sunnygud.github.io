<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Career 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #F5F8FA; --surface: #FFFFFF; --surface2: #F0F3F5;
  --border: #E0E4E9; --ink: #232A31; --mid: #5B636A; --dim: #828A93;
  --p: #6001D2; --p-lt: #7E1FFF; --p-gl: rgba(96,1,210,.10); --p-deep: #3F008B;
  --green: #1AC567; --blue: #0F69FF; --pink: #FF0080; --yellow: #FFA700;
  --sidebar: 248px; --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink);
  font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }

.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
aside.sidebar {
  background: var(--surface); border-right: 1px solid var(--border);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: 10px 10px 16px; display: flex; flex-direction: column;
}
.logo-block { padding: 8px 8px 14px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.brand-pill {
  background: #6001D2; color: #fff; border-radius: 8px; padding: 10px 12px;
  font-weight: 800; font-size: 13px; letter-spacing: .02em;
}
.logo-block h1 { font-size: 16px; font-weight: 800; margin: 12px 0 4px; letter-spacing: -.02em; }
.logo-block .pill {
  display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; background: var(--p-gl); color: var(--p);
  padding: 3px 8px; border-radius: 999px;
}
.section-label {
  font: 800 11px Inter; text-transform: uppercase; letter-spacing: .1em;
  color: #232A31; padding: 16px 12px 6px; margin-top: 4px;
  border-top: 1px solid var(--border);
}
.section-label:first-of-type { border-top: 0; padding-top: 8px; }
.inst-btn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: transparent; border: 1px solid transparent;
  border-radius: 8px; padding: 8px 12px 8px 18px; margin-bottom: 2px;
  font: 600 11px Inter; letter-spacing: .04em; text-transform: uppercase;
  color: var(--mid); cursor: pointer; text-align: left;
}
.inst-btn:hover { background: var(--p-gl); color: var(--ink); }
.inst-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .7; flex-shrink: 0; }
.inst-btn .name { flex: 1; }
.inst-btn .yrs { font-size: 10px; color: var(--dim); font-weight: 500; text-transform: none; letter-spacing: 0; }
.inst-btn.active {
  background: linear-gradient(135deg, var(--p), var(--p-deep));
  color: #fff;
}
.inst-btn.active .yrs { color: rgba(255,255,255,.8); }
.side-foot { margin-top: auto; padding: 12px 8px 4px; font-size: 11px; color: var(--dim); line-height: 1.4; }
.side-foot a { color: var(--p); font-weight: 600; text-decoration: none; }

main.main { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
nav.top-tabs {
  display: flex; align-items: flex-end; gap: 2px;
  padding: 14px 18px 0; background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 40;
}
.tabs-scroll { display: flex; gap: 2px; overflow-x: auto; flex: 1; margin-bottom: -1px; scrollbar-width: none; }
.tabs-scroll::-webkit-scrollbar { display: none; }
nav.top-tabs button {
  position: relative; background: transparent; border: 1px solid transparent; border-bottom: 0;
  padding: 8px 12px 10px; font: 600 12.5px Inter; color: var(--dim); cursor: pointer;
  border-radius: 8px 8px 0 0; white-space: nowrap;
}
nav.top-tabs button:hover { background: var(--surface2); color: var(--mid); }
nav.top-tabs button.active {
  background: var(--bg); border-color: var(--border); color: var(--ink); font-weight: 700;
}
nav.top-tabs button.active::before {
  content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 2px;
  background: var(--p); border-radius: 2px;
}
.top-meta { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 0 0 8px 12px; flex-shrink: 0; }
.top-meta a, .top-meta button {
  font: 600 11px Inter; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: #fff; color: var(--ink); text-decoration: none; cursor: pointer;
}
.crumb {
  padding: 8px 22px; font-size: 11px; color: var(--dim); background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.crumb b { color: var(--p); font-weight: 700; }
.content { padding: 22px 28px 48px; max-width: 1120px; }
.hero h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; }
.hero p { font-size: 14px; color: var(--mid); line-height: 1.45; max-width: 860px; margin-bottom: 16px; }

.lede {
  background: #F7F2FF; border: 1px solid #E4D4FA; border-radius: 10px;
  padding: 12px 14px; margin-bottom: 16px; font-size: 14px; line-height: 1.4; color: var(--ink);
}

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.kpi .l { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.kpi .v { font-size: 14px; font-weight: 700; margin-top: 6px; line-height: 1.25; }

.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.card h3 { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.card p, .card li { font-size: 13.5px; color: var(--mid); line-height: 1.42; }
.card.p { background: #F7F2FF; border-color: #E4D4FA; }
ul { list-style: none; }
ul li { position: relative; padding-left: 14px; margin: 5px 0; }
ul li:before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--p); }

.story { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.story button {
  text-align: left; background: #fff; border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 14px 12px; cursor: pointer; font: inherit; color: inherit;
}
.story button:hover { border-color: var(--p); }
.story button .n { font-size: 11px; font-weight: 800; color: var(--p); margin-bottom: 6px; }
.story button b { display: block; font-size: 14px; margin-bottom: 4px; }
.story button span { font-size: 12.5px; color: var(--mid); line-height: 1.35; }

.pre {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px; line-height: 1.5; background: #232A31; color: #E8EEF2;
  border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 8px 0 14px;
  white-space: pre;
}
.pre .c { color: #9aa4ae; }
.pre .h { color: #C8B0E8; }

table.art { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
table.art th, table.art td { padding: 9px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.art th { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); background: var(--surface2); }
table.art td:first-child { font-weight: 650; width: 28%; color: var(--ink); }
table.art tr:last-child td { border-bottom: 0; }

.lane { border: 1px dashed var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface); margin-bottom: 8px; }
.lane h4 { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.nodeb {
  flex: 1; min-width: 120px; background: #fff; border: 1.5px solid var(--border);
  border-radius: 8px; padding: 10px 12px; font-size: 12.5px; font-weight: 700;
}
.nodeb span { display: block; font-weight: 500; color: var(--mid); font-size: 11.5px; margin-top: 3px; }
.nodeb.blue { background: #dbeafe; border-color: #3b82f6; }
.nodeb.yellow { background: #fef08a; border-color: #eab308; }
.nodeb.pink { background: #fbcfe8; border-color: #ec4899; }
.nodeb.green { background: #dcfce7; border-color: #22c55e; }
.nodeb.grey { background: #f3f4f6; border-color: #6b7280; }
.nodeb.purple { background: #F3EBFF; border-color: #6001D2; }
.arrow { align-self: center; color: var(--p); font-weight: 800; font-size: 14px; }

.arch-sub { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.arch-sub button {
  font: 650 11px Inter; padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: #fff; color: var(--mid); cursor: pointer;
}
.arch-sub button.on { background: var(--p); color: #fff; border-color: var(--p); }
.arch-view { display: none; }
.arch-view.on { display: block; }
.seq { border-left: 3px solid var(--p); padding: 0 0 0 14px; margin: 8px 0; }
.seq li { list-style: none; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--mid); }
.seq li b { color: var(--ink); }
.seq li:before { display: none; }
img.arch-img { width: 100%; max-width: 1040px; border: 1px solid var(--border); border-radius: 10px; background: #fff; display: block; margin: 0 0 8px; }
.arch-cap { font-size: 12px; color: var(--mid); margin: 0 0 16px; }
.note { font-size: 12px; color: var(--dim); margin-top: 12px; }

.mmap { display: grid; gap: 10px; }
.mmap-root {
  background: var(--p); color: #fff; border-radius: 12px; padding: 14px 16px;
  font-weight: 700; font-size: 15px;
}
.mmap-root span { display: block; font-weight: 500; font-size: 12px; opacity: .85; margin-top: 4px; }
.mmap-steps { display: flex; flex-wrap: wrap; gap: 6px; }
.mmap-steps b {
  background: #fff; border: 1.5px solid var(--p); color: var(--p);
  border-radius: 999px; padding: 5px 10px; font-size: 11.5px; font-weight: 700;
}
.mmap-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mmap-col { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.mmap-col h3 { font-size: 13px; margin: 0 0 8px; color: var(--p); }
.mmap-col.peer h3 { color: var(--ink); }
.mmap-col ul { margin: 0; padding-left: 16px; color: var(--mid); font-size: 13px; }
.mmap-col li { margin: 4px 0; }
.mmap-share {
  background: var(--wash); border: 1px dashed var(--p); border-radius: 12px;
  padding: 12px 14px; font-size: 13px; color: var(--mid);
}
.mmap-share b { color: var(--ink); }
@media (max-width: 800px) { .mmap-split { grid-template-columns: 1fr; } }

.loop {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  margin: 0 0 16px;
}
.loop-node {
  background: #fff; border: 1.5px solid var(--p); border-radius: 12px;
  padding: 12px 10px; text-align: center; font-weight: 700; font-size: 13px; color: var(--ink);
}
.loop-node .api {
  display: block; font-weight: 600; font-size: 10px; letter-spacing: .05em;
  text-transform: uppercase; color: var(--p); margin-top: 6px; line-height: 1.35;
}
.loop-node.on { background: var(--p); color: #fff; }
.loop-node.on .api { color: #E8D7FF; }
.stat-strip {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 16px;
}
.stat-strip div {
  background: #fff; border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 12px 10px; text-align: center;
}
.stat-strip b { display: block; font-size: 20px; color: var(--p); letter-spacing: -.02em; }
.stat-strip span { display: block; font-size: 11px; color: var(--mid); margin-top: 4px; font-weight: 600; }
@media (max-width: 800px) {
  .loop, .stat-strip { grid-template-columns: 1fr 1fr; }
}

.career-graph {
  background: #fff; border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px 12px; margin-bottom: 18px;
}
.career-graph .axis-label {
  display: flex; justify-content: space-between; font-size: 11px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px;
}
.cg-track {
  position: relative; height: 14px; background: #EEE4FA; border-radius: 99px; margin: 8px 0 18px;
}
.cg-fill {
  position: absolute; top: 0; bottom: 0; border-radius: 99px;
  background: linear-gradient(90deg, #C8B0E8, var(--p));
}
.cg-now {
  position: absolute; top: -6px; width: 3px; height: 26px; background: var(--p);
  border-radius: 2px;
}
.cg-rows { display: flex; flex-direction: column; gap: 10px; }
.cg-row {
  display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center;
  cursor: pointer; border: 0; background: transparent; font: inherit; text-align: left; width: 100%;
  padding: 0; position: relative; z-index: 1;
}
.cg-row:hover, .cg-row:focus-visible { z-index: 8; }
.cg-row:hover .cg-bar, .cg-row:focus-visible .cg-bar { outline: 2px solid var(--p-lt); outline-offset: 1px; }
.cg-yr { font-size: 11px; font-weight: 800; color: var(--p); letter-spacing: .02em; }
.cg-bar-wrap { position: relative; height: 36px; background: var(--surface2); border-radius: 8px; overflow: visible; }
.cg-bar {
  position: absolute; top: 4px; bottom: 4px; border-radius: 6px;
}
.cg-lab {
  position: absolute; top: 0; bottom: 0;
  display: flex; align-items: center;
  font-size: 12px; font-weight: 700; color: var(--ink);
  white-space: nowrap; padding: 0 10px; pointer-events: none;
}
.cg-lab.in { color: #fff; }
.cg-bar.grad { background: #5B636A; }
.cg-bar.early { background: #828A93; }
.cg-bar.dell { background: #3D7EA6; }
.cg-bar.vale { background: #1AC567; }
.cg-bar.ger { background: #0F69FF; }
.cg-bar.bw { background: #232A31; }
.cg-bar.wwe { background: #7E1FFF; }
.cg-bar.warn { background: #FF0080; }
.cg-bar.aml { background: #FFA700; }
.cg-bar.yh { background: linear-gradient(90deg, var(--p), var(--p-deep)); }
.cg-tip {
  display: none; position: absolute; left: 0; right: auto; bottom: calc(100% + 8px);
  width: min(420px, 70vw); z-index: 9;
  background: rgba(247, 242, 255, .78);
  -webkit-backdrop-filter: blur(14px) saturate(1.15);
  backdrop-filter: blur(14px) saturate(1.15);
  border: 1px solid rgba(228, 212, 250, .95);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 8px 24px rgba(96, 1, 210, .10);
  pointer-events: none;
  font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
  color: var(--ink);
}
.cg-row:hover .cg-tip, .cg-row:focus-visible .cg-tip { display: block; }
.cg-rows .cg-row:first-child .cg-tip { bottom: auto; top: calc(100% + 8px); }
.cg-tip b {
  display: block; margin-bottom: 6px;
  font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--p);
}
.cg-tip p {
  margin: 0; font-size: 13.5px; font-weight: 500; line-height: 1.42; color: var(--mid);
}
.cg-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 11px; color: var(--mid); }
.cg-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

@media print {
  aside.sidebar, nav.top-tabs, .top-meta, .crumb { display: none !important; }
  .shell { display: block; }
  .content { max-width: none; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  aside.sidebar { position: relative; height: auto; }
  .kpis, .g2, .g3, .story { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
const LABELS = {
  arc: "Timeline", viking: "Viking fit",
  "tableau-early": "WWE · Warner DCU",
  migrate: "Migrate & 6 instances", looker: "Looker", tableau: "Tableau",
  enable: "Self-serve & train", semantic: "Semantic → viz → talk",
  oracle: "Oracle modules", ai: "Conversational AI", pipeline: "Estate & AI cost",
  execute: "Tickets & PRs", arch: "Architecture", repos: "Git repos"
};
const TABS = {
  arc:        [["graph","Career graph"],["walk","The walk"],["years","Yahoo years"]],
  viking:     [["map","The map"],["pbi","Power BI + Databricks"]],
  foundation: [["work","The path"],["bw","Bridgewater"]],
  "tableau-early": [["wwe","WWE"],["warner","Warner DCU"]],
  pbi:        [["aml","AML / OFAC"],["coe","Finance SME"]],
  migrate:    [["onprem","On-prem → cloud"],["six","Why six"]],
  looker:     [["did","What I did"],["viz","Users build viz"]],

function cards(arr, cols) {

function kpis(items) {

function loopBar(on) {

  ).join("")}</div>`;
}
function cgRow({yr, goP, goS, cls, left, width, lab, inBar, tipH, tip}) {

      <ol class="seq">
        <li><b>Prompt</b> — user asks for planning data in the IDE.</li>
        <li><b>Tool call</b> — IDE → local MCP.</li>
        <li><b>PKCE</b> — browser → Identity Domain → SSO / MFA. Auth code back on localhost. Exchange for a 60-minute access token in RAM.</li>
        <li><b>REST</b> — Bearer to Planning. Native security decides 403 or JSON.</li>
        <li><b>Refresh</b> — under 5 minutes left, silent refresh. No extra MFA unless the session is dead.</li>
      </ol>`,
    setup: `<div class="hero"><h2>Desktop setup — how people actually got it</h2>
      <p>From the setup guide I wrote. Builders get one command. Locked laptops get a package. Same engine.</p></div>
      ${say("A 20-step notepad install fails on Finance Windows. Setup is a product.")}
      ${cards([
        {h:"Who it was for", html:"<p>People with local admin and git. Everyone else: Software Center / packaging — no admin, same server.</p>"},
        {h:"One command", html:"<p>Mac: clone or pull, then <code>setup.sh</code>. Windows: same with <code>setup.ps1</code>. Wires Cursor and Claude Desktop. Restart the app.</p>", p:true}
      ])}
      <ol class="seq">
        <li><b>Code from regulated git</b> — users do not hand-edit the connection logic.</li>
        <li><b>First prompt</b> — “list configured environments.” Browser opens.</li>
        <li><b>Localhost TLS warning</b> — expected. Self-signed cert for the OAuth callback on localhost. Proceed, then SSO / MFA.</li>
        <li><b>Back in the IDE</b> — environments list. Token in RAM. 60 minutes. Silent refresh.</li>
        <li><b>401 / 403</b> — expired session → new login. Persistent 403 → they do not have the module. Call the app owner, not the AI.</li>
      </ol>
      <p class="note">When the enterprise gateway shipped, I retired this local installer. Same image moved to private compute.</p>`,
    prod: `<div class="hero"><h2>Production — gateway, private compute, vendor source</h2></div>
      <img class="arch-img" src="arch-production-gateway-fargate.png" alt="Gateway to private Fargate" />
      <div class="g3" style="margin-top:12px">
        <div class="card"><h3>Front door</h3><p>MCP Gateway. One URL. OAuth for the session.</p></div>
        <div class="card"><h3>Private compute</h3><p>mTLS. Fargate: app + identity sidecar.</p></div>
        <div class="card"><h3>Source</h3><p>Oracle. User roles unchanged.</p></div>
      </div>`,
    dock: `<div class="hero"><h2>Same image. Three homes.</h2></div>
      <div class="row">
        <div class="nodeb blue">Laptop container<span>bind-mount · TLS localhost</span></div>
        <div class="arrow">→</div>
        <div class="nodeb purple">CI<span>multi-stage Dockerfile</span></div>
        <div class="arrow">→</div>
        <div class="nodeb yellow">Registry</div>
        <div class="arrow">→</div>
        <div class="nodeb green">Fargate<span>ops rolls the tag</span></div>
      </div>
      <p class="note">When the gateway shipped, I retired my installer.</p>`
  };
  return bar + views[which];
}

let proj = "arc", skill = "graph";

function renderTabs() {
  const tabs = TABS[proj];
  document.getElementById("tabs").innerHTML = tabs.map(([id, label]) =>
    `<button type="button" data-skill="${id}" class="${id===skill?"active":""}">${label}</button>`
  ).join("");
}

function render() {
  const tabs = TABS[proj];
  if (!tabs.find(([id]) => id === skill)) skill = tabs[0][0];
  document.getElementById("crumb-p").textContent = LABELS[proj];
  document.getElementById("crumb-s").textContent = (tabs.find(([id]) => id === skill) || ["",""])[1];
  document.querySelectorAll(".inst-btn").forEach(b => {
    const siblings = document.querySelectorAll(`.inst-btn[data-proj="${b.dataset.proj}"]`);
    const unique = siblings.length === 1;
    const on = b.dataset.proj === proj && (unique || b.dataset.skill === skill);
    b.classList.toggle("active", on);
  });
  renderTabs();
  const block = COPY[proj][skill];
  document.getElementById("stage").innerHTML = typeof block === "function" ? block() : block;
}

document.querySelector("aside.sidebar").addEventListener("click", e => {
  const b = e.target.closest(".inst-btn");
  if (!b) return;
  proj = b.dataset.proj;
  skill = b.dataset.skill || TABS[proj][0][0];
  render();
});
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-skill]");
  if (!b) return;
  skill = b.dataset.skill;
  render();
});
document.getElementById("stage").addEventListener("click", e => {
  const c = e.target.closest("[data-go-p]");
  if (!c) return;
  proj = c.dataset.goP;
  skill = c.dataset.goS;
  render();
});
render();
</script>
